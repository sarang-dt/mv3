<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>사역반 성경암송</title>
    <meta name="description" content="사랑의교회 사역반 성경 구절을 듣고 반복 재생하며 암송하는 앱">

    <!-- 홈 화면에 추가했을 때 앱처럼 동작하도록 -->
    <meta name="theme-color" content="#07090f">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <!-- iOS (Safari 는 manifest 를 일부만 따르므로 별도 지정) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="성경암송">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;          /* 다크 전용 앱 */
            --bg:            #07090f;
            --bg2:           #0c1020;
            --bg3:           #111830;
            --surface:       rgba(255,255,255,0.04);
            --surface2:      rgba(255,255,255,0.07);
            --border:        rgba(255,255,255,0.07);
            --border2:       rgba(255,255,255,0.12);
            --accent:        #6ed48a;
            --accent-rgb:    110,212,138;
            --accent-deep:   #3fa863;
            --accent-deep2:  #2f8a4b;
            --on-accent:     #04180c;
            --accent-soft:   rgba(110,212,138,0.12);
            --accent-border: rgba(110,212,138,0.28);
            --accent-glow:   rgba(110,212,138,0.18);
            --text1:         #edf0f8;
            --text2:         #8898b8;
            --text3:         #4a5a78;
            --green:         #6ec87a;
            --red:           #e07070;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; overflow:hidden; }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text1);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        /* ── App Shell ─────────────────────────────── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ── Header ────────────────────────────────── */
        .header {
            flex-shrink: 0;
            padding: 16px 20px 12px;
            padding-top: max(16px, env(safe-area-inset-top));
            background: rgba(7,9,15,0.9);
            border-bottom: 1px solid var(--border);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
        }
        .header-logo {
            height: 28px;
            width: auto;
            flex-shrink: 0;
        }
        .brand-divider {
            width: 1px;
            height: 19px;
            background: var(--border2);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text1);
            letter-spacing: -0.03em;
            white-space: nowrap;
        }
        /* 좁은 화면에서 한 줄이 넘치지 않도록 */
        @media (max-width: 359px) {
            .header-logo { height: 24px; }
            .header h1   { font-size: 0.94rem; }
            .header-brand { gap: 8px; }
        }

        /* ── Segmented Control (설정 시트에서 사용) ──── */
        .seg {
            flex: 1;
            display: flex;
            gap: 3px;
            padding: 3px;
            border-radius: 12px;
            border: 1px solid var(--border2);
            background: var(--surface);
        }
        .seg-btn {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--text2);
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: -0.01em;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.18s;
        }
        .seg-btn.active {
            background: var(--accent-soft);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent-border);
        }
        .seg-btn:active { transform: scale(0.95); }

        /* ── Week Tabs ──────────────────────────────── */
        .week-tabs {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            padding: 10px 14px;
            gap: 6px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .week-tabs::-webkit-scrollbar { display:none; }

        .wtab {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text2);
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wtab.active {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
            box-shadow: 0 2px 14px rgba(var(--accent-rgb),0.35);
        }

        /* ── Scrollable Content ─────────────────────── */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 14px 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar { display:none; }

        /* Theme Row */
        .theme-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .seg-btn:disabled {
            opacity: 0.28;
            cursor: not-allowed;
        }
        .theme-badge {
            flex: 1;
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-border);
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }


        /* Verse Card */
        .verse-card {
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            padding: 16px 16px 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .verse-card.playing {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb),0.055);
            box-shadow: 0 0 28px var(--accent-glow), inset 0 0 20px rgba(var(--accent-rgb),0.03);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .verse-num {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            padding: 2px 8px;
            letter-spacing: 0.04em;
        }
        .verse-ref {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }
        .card-play-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text2);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .verse-card.playing .card-play-btn {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
        }
        .card-play-btn:active { transform: scale(0.92); }

        .verse-text {
            font-size: 1.02rem;
            line-height: 2.0;
            color: #c8d4e8;
            word-break: keep-all;
            font-weight: 400;
        }
        .verse-text.en {
            line-height: 1.8;
            letter-spacing: -0.005em;
        }
        .verse-card.playing .verse-text {
            color: var(--text1);
        }

        /* Playing pulse animation */
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50%       { box-shadow: 0 0 36px rgba(var(--accent-rgb),0.28); }
        }
        .verse-card.playing { animation: pulse-border 2.5s ease-in-out infinite; }

        /* ── Player ────────────────────────────────── */
        .player {
            flex-shrink: 0;
            background: rgba(7,9,15,0.96);
            border-top: 1px solid var(--border);
            padding: 12px 18px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            backdrop-filter: blur(16px);
        }

        /* Progress */
        .progress-area { margin-bottom: 10px; }
        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-track:hover { height: 5px; margin: -1px 0; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-deep), var(--accent));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .progress-track:hover .progress-fill::after { opacity: 1; }
        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.72rem;
            color: var(--text3);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .cbtn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border2);
            background: var(--surface);
            color: var(--text2);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
            font-weight: 700;
        }
        .cbtn:hover { background: var(--surface2); color: var(--text1); }
        .cbtn:active { transform: scale(0.93); }

        .cbtn.play-main {
            width: 64px; height: 64px;
            background: linear-gradient(145deg, var(--accent), var(--accent-deep2));
            color: var(--on-accent);
            font-size: 1.5rem;
            border: none;
            box-shadow: 0 4px 20px rgba(var(--accent-rgb),0.4);
        }
        .cbtn.play-main:hover { box-shadow: 0 4px 28px rgba(var(--accent-rgb),0.55); }
        .cbtn.play-main:active { background: linear-gradient(145deg, #d9a840, #b07820); }

        .cbtn.speed { font-size: 0.75rem; letter-spacing:-0.03em; }

        .repeat-wrap { position: relative; }
        .rbadge {
            position: absolute;
            top: -3px; right: -3px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 0.6rem;
            font-weight: 800;
            min-width: 17px; height: 17px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
            pointer-events: none;
        }

        /* Status */
        .status {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text3);
            min-height: 1.1em;
            letter-spacing: 0.01em;
        }
        .status.playing { color: var(--green); }
        .status.error   { color: var(--red); }
        .status.warn    { color: var(--accent); opacity: 0.8; }

        /* ── 설정 진입 바 ──────────────────────────── */
        .settings-bar {
            width: 100%;
            margin-top: 11px;
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--text2);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            transition: all 0.18s;
        }
        .settings-bar:hover { background: var(--surface); color: var(--text1); }
        .settings-bar:active { transform: scale(0.985); }
        .settings-bar svg { flex-shrink: 0; opacity: 0.75; }

        /* ── Bottom Sheet Modal ─────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }
        .overlay.show { display: flex; }

        .sheet {
            width: 100%;
            max-width: 520px;
            background: #111828;
            border-radius: 24px 24px 0 0;
            padding: 20px 18px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border: 1px solid var(--border2);
            border-bottom: none;
            max-height: 88vh;
            overflow-y: auto;
        }
        .set-group { margin-bottom: 15px; }
        .set-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text2);
            letter-spacing: 0.02em;
            margin-bottom: 7px;
            padding-left: 2px;
        }
        .sheet-handle {
            width: 36px; height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            margin: 0 auto 16px;
        }
        .sheet h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text1);
            text-align: center;
            margin-bottom: 16px;
        }
        .repeat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .ropt {
            padding: 13px 6px;
            border-radius: 12px;
            border: 1px solid var(--border2);
            background: var(--surface);
            color: var(--text1);
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .ropt:hover { background: var(--surface2); }
        .ropt.sel {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
        }
        .ropt.inf { font-size: 1.4rem; padding: 9px 6px; }

        .sheet-close {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            color: var(--accent);
            font-size: 0.92rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .sheet-close:hover { background: rgba(var(--accent-rgb),0.2); }

        /* ── Waveform animation for playing state ─── */
        .wave-icon {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
        }
        .wave-icon span {
            display: block;
            width: 3px;
            background: var(--green);
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite alternate;
        }
        .wave-icon span:nth-child(1) { height: 6px;  animation-delay: 0s; }
        .wave-icon span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
        .wave-icon span:nth-child(3) { height: 9px;  animation-delay: 0.3s; }
        .wave-icon span:nth-child(4) { height: 12px; animation-delay: 0.1s; }
        @keyframes wave {
            from { transform: scaleY(0.4); }
            to   { transform: scaleY(1); }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <img class="header-logo" src="logo_Sarang.png" alt="남가주사랑의교회"
                 width="496" height="115">
            <span class="brand-divider"></span>
            <h1>사역반 성경암송</h1>
        </div>
    </div>

    <!-- Week Tabs -->
    <div class="week-tabs" id="weekTabs"></div>

    <!-- Verse Content -->
    <div class="content" id="content"></div>

    <!-- Player -->
    <div class="player">
        <!-- Progress -->
        <div class="progress-area">
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-row">
                <span id="curTime">0:00</span>
                <span id="totTime">0:00</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="cbtn speed" id="speedBtn" aria-label="재생속도">1x</button>
            <button class="cbtn" id="prevBtn" aria-label="이전">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="5" y="5" width="2.5" height="14" rx="1.2"/>
                    <polygon points="19,5 9,12 19,19"/>
                </svg>
            </button>
            <button class="cbtn play-main" id="playBtn" aria-label="재생">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
            </button>
            <button class="cbtn" id="nextBtn" aria-label="다음">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="16.5" y="5" width="2.5" height="14" rx="1.2"/>
                    <polygon points="5,5 15,12 5,19"/>
                </svg>
            </button>
            <div class="repeat-wrap">
                <button class="cbtn" id="repeatBtn" aria-label="반복설정">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                </button>
                <span class="rbadge" id="rbadge">∞</span>
            </div>
        </div>

        <div class="status" id="status">과를 선택하고 재생하세요</div>

        <!-- Settings -->
        <button class="settings-bar" id="settingsBtn" aria-label="설정 열기">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span id="settingsSummary">한국어 · 여성 · 전체</span>
        </button>
    </div>
</div>

<!-- Settings Sheet -->
<div class="overlay" id="overlay">
    <div class="sheet">
        <div class="sheet-handle"></div>
        <h3>설정</h3>

        <div class="set-group">
            <div class="set-label">언어</div>
            <div class="seg" id="langSeg">
                <button class="seg-btn active" data-lang="ko">한국어</button>
                <button class="seg-btn"        data-lang="en">English</button>
            </div>
        </div>

        <div class="set-group">
            <div class="set-label">음성</div>
            <div class="seg" id="genderSeg">
                <button class="seg-btn active" data-gender="F">여성</button>
                <button class="seg-btn"        data-gender="M">남성</button>
            </div>
        </div>

        <div class="set-group">
            <div class="set-label">재생 구간</div>
            <div class="seg" id="modeSeg">
                <button class="seg-btn"        data-mode="v1">1절만</button>
                <button class="seg-btn"        data-mode="v2">2절만</button>
                <button class="seg-btn active" data-mode="all">전체</button>
            </div>
        </div>

        <div class="set-label">반복 횟수</div>
        <div class="repeat-grid">
            <button class="ropt"     data-val="1">1회</button>
            <button class="ropt"     data-val="2">2회</button>
            <button class="ropt"     data-val="3">3회</button>
            <button class="ropt"     data-val="5">5회</button>
            <button class="ropt"     data-val="7">7회</button>

                        en: "For where two or three are gathered in my name, there am I among them." }
            }
        ]
    },
    {
        label:     "3-특별3과",
        theme:     { ko: "사역훈련과 아웃리치 (3)", en: "Ministry and Outreach (3)" },
        titleBase: "B3S03_Ministry_and_Outreach_3",
        verses: [
            {
                base: "B3S03a_Mark_6-34",
                ref:  { ko: "마가복음 6:34", en: "Mark 6:34" },
                text: { ko: "예수께서 나오사 큰 무리를 보시고 그 목자 없는 양 같음으로 인하여 불쌍히 여기사 이에 여러 가지로 가르치시더라",
                        en: "When he went ashore he saw a great crowd, and he had compassion on them, because they were like sheep without a shepherd. And he began to teach them many things." }
            },
            {
                base: "B3S03b_Jas_2-16",
                ref:  { ko: "야고보서 2:16", en: "James 2:16" },
                text: { ko: "너희 중에 누구든지 그에게 이르되 평안히 가라, 덥게 하라, 배부르게 하라 하며 그 몸에 쓸 것을 주지 아니하면 무슨 유익이 있으리요",
                        en: "and one of you says to them, “Go in peace, be warmed and filled,” without giving them the things needed for the body, what good is that?" }
            }
        ]
    },
    {
        label:     "3-특별4과",
        theme:     { ko: "사역훈련과 아웃리치 (4)", en: "Ministry and Outreach (4)" },
        titleBase: "B3S04_Ministry_and_Outreach_4",
        verses: [
            {
                base: "B3S04a_Phil_2-14",
                ref:  { ko: "빌립보서 2:14", en: "Philippians 2:14" },
                text: { ko: "모든 일을 원망과 시비가 없이 하라",
                        en: "Do all things without grumbling or disputing," }
            },
            {
                base: "B3S04b_1Tim_4-15",
                ref:  { ko: "디모데전서 4:15", en: "First Timothy 4:15" },
                text: { ko: "이 모든 일에 전심 전력하여 너의 성숙함을 모든 사람에게 나타나게 하라",
                        en: "Practice these things, immerse yourself in them, so that all may see your progress." }
            }
        ]
    }
];

// ═══════════════════════════════════════════════════════
//  오디오 경로 헬퍼
//  Audio/{베이스}_{KO|EN}_{F|M}.mp3
//    제목 → Audio/T01_Christ_the_Center_KO_F.mp3
//    구절 → Audio/01_Gal_2-20_KO_F.mp3
// ═══════════════════════════════════════════════════════
function src(weekIdx, track) {  // track: 1=제목, 2=1절, 3=2절
    const w = WEEKS[weekIdx];
    const base = track === 1 ? w.titleBase : w.verses[track-2].base;
    return `Audio/${base}_${lang.toUpperCase()}_${gender}.mp3`;
}

// ═══════════════════════════════════════════════════════
//  상태
// ═══════════════════════════════════════════════════════
let week        = 0;          // 현재 과 인덱스
let lang        = 'ko';       // 'ko' | 'en'  — 음성 + 화면 텍스트
let gender      = 'F';        // 'F' | 'M'    — 음성 성별
let mode        = 'all';      // 'v1' | 'v2' | 'all'  (기본: 전체)
let repeatTotal = 0;          // 반복 횟수 (0 = 무한)
let repeatNow   = 0;          // 현재 반복 회차
let speedIdx    = 0;
const SPEEDS    = [1, 1.25, 1.5, 2];

let audio       = null;       // 현재 Audio 객체
let isPlaying   = false;
let queue       = [];         // 재생할 트랙 번호 배열 (2|3)
let qIdx        = 0;          // 큐 내 현재 인덱스

// ═══════════════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════════════
const $weekTabs  = document.getElementById('weekTabs');
const $content   = document.getElementById('content');
const $playBtn   = document.getElementById('playBtn');
const $prevBtn   = document.getElementById('prevBtn');
const $nextBtn   = document.getElementById('nextBtn');
const $speedBtn  = document.getElementById('speedBtn');
const $repeatBtn = document.getElementById('repeatBtn');
const $rbadge    = document.getElementById('rbadge');
const $status    = document.getElementById('status');
const $progTrack = document.getElementById('progressTrack');
const $progFill  = document.getElementById('progressFill');
const $curTime   = document.getElementById('curTime');
const $totTime   = document.getElementById('totTime');
const $langSeg   = document.getElementById('langSeg');
const $genderSeg = document.getElementById('genderSeg');
const $modeSeg   = document.getElementById('modeSeg');
const $settingsBtn     = document.getElementById('settingsBtn');
const $settingsSummary = document.getElementById('settingsSummary');
const $overlay   = document.getElementById('overlay');
const $sheetClose = document.getElementById('sheetClose');

// ═══════════════════════════════════════════════════════
//  유틸
// ═══════════════════════════════════════════════════════
function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return `${m}:${sec<10?'0':''}${sec}`;
}
function vCount(w = week) { return WEEKS[w].verses.length; }
function wLabel() {
    if (vCount() < 2) return '1절';
    return mode === 'v1' ? '1절' : mode === 'v2' ? '2절' : '1절+2절';
}
function buildQueue() {
    if (vCount() < 2)   return [1, 2];      // 구절이 하나뿐인 과
    if (mode === 'v1')  return [1, 2];
    if (mode === 'v2')  return [1, 3];
    return [1, 2, 3];
}
// 구절이 하나뿐인 과에서는 '2절만' 을 고를 수 없게 한다
function syncModeAvail() {
    const only1 = vCount() < 2;
    const btn2  = $modeSeg.querySelector('[data-mode="v2"]');
    if (btn2) btn2.disabled = only1;
    if (only1 && mode === 'v2') setMode('all');
}

// ═══════════════════════════════════════════════════════
//  렌더링
// ═══════════════════════════════════════════════════════
function renderTabs() {
    $weekTabs.innerHTML = '';
    WEEKS.forEach((w, i) => {
        const btn = document.createElement('button');
        btn.className = `wtab${i===week?' active':''}`;
        btn.dataset.w = i;
        btn.textContent = w.label;
        $weekTabs.appendChild(btn);
    });
}

function renderContent() {
    const w = WEEKS[week];
    $content.innerHTML = `
        <div class="theme-row">
            <div class="theme-badge">${w.label} · ${w.theme[lang]}</div>
        </div>
        ${w.verses.map((v,i) => `
            <div class="verse-card" id="card-${i}">
                <div class="card-header">
                    <div class="card-meta">
                        <span class="verse-ref">${v.ref[lang]}</span>
                    </div>
                    <button class="card-play-btn" id="cpbtn-${i}" aria-label="${i+1}절 재생"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></button>
                </div>
                <div class="verse-text${lang === 'en' ? ' en' : ''}" lang="${lang}">${v.text[lang]}</div>
            </div>
        `).join('')}
    `;

    // 카드 재생 버튼
    w.verses.forEach((_,i) => {
        document.getElementById(`cpbtn-${i}`).onclick = () => {
            setMode(i===0 ? 'v1' : 'v2');
            startPlay();
        };
    });
}

function renderTabActive() {
    document.querySelectorAll('.wtab').forEach((b,i) => {
        b.classList.toggle('active', i===week);
    });
}

function setCardPlaying(verseIdx) {
    // verseIdx: 0-based (null = none)
    for (let i=0; i<vCount(); i++) {
        const card = document.getElementById(`card-${i}`);
        const btn  = document.getElementById(`cpbtn-${i}`);
        if (!card) continue;
        const active = (i === verseIdx) && isPlaying;
        card.classList.toggle('playing', active);
        if (btn) btn.innerHTML = active
            ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4" height="18" rx="1.5"/><rect x="15" y="3" width="4" height="18" rx="1.5"/></svg>`
            : `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>`;
    }
}

function clearCards() { setCardPlaying(null); }

// ═══════════════════════════════════════════════════════
//  언어 / 음성
// ═══════════════════════════════════════════════════════
const PREF_KEY = 'srcc-dt3-pref';

function savePref() {
    try {
        localStorage.setItem(PREF_KEY, JSON.stringify({ lang, gender, mode, repeat: repeatTotal }));
    } catch {}
}
function loadPref() {
    try {
        const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
        if (p.lang === 'ko' || p.lang === 'en')            lang   = p.lang;
        if (p.gender === 'F' || p.gender === 'M')          gender = p.gender;
        if (['v1','v2','all'].includes(p.mode))            mode   = p.mode;
        if (Number.isInteger(p.repeat) && p.repeat >= 0)   repeatTotal = p.repeat;
    } catch {}
}

// 설정 바에 현재 선택을 요약해 보여준다
function updateSummary() {
    if (!$settingsSummary) return;
    const L = lang === 'ko' ? '한국어' : 'English';
    const G = gender === 'F' ? '여성' : '남성';
    const M = mode === 'v1' ? '1절만' : mode === 'v2' ? '2절만' : '전체';
    $settingsSummary.textContent = `${L} · ${G} · ${M}`;
}

function openSettings()  { $overlay.classList.add('show'); }
function closeSettings() { $overlay.classList.remove('show'); }

// 선택 변경 시: 화면 텍스트를 다시 그리고, 재생 중이면 새 음성으로 재시작
function applyVoiceChange() {
    const wasPlaying = isPlaying;
    if (wasPlaying) stopAudio();
    renderContent();
    if (wasPlaying) startPlay();
    else setStatus('', `${WEEKS[week].label} · ${WEEKS[week].theme[lang]}`);
    savePref();
    updateSummary();
    prefetchWeek(week);
}

function setLang(l) {
    if (l === lang) return;
    lang = l;
    document.documentElement.lang = l;
    $langSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    applyVoiceChange();
}

function setGender(g) {
    if (g === gender) return;
    gender = g;
    $genderSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.gender === g));
    applyVoiceChange();
}

// ═══════════════════════════════════════════════════════
//  모드
// ═══════════════════════════════════════════════════════
function setMode(m) {
    mode = m;
    $modeSeg.querySelectorAll('.seg-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === m);
    });
    updateSummary();
    savePref();
}

// 반복 횟수 (0 = 무한)
function setRepeat(v) {
    repeatTotal = v;
    document.querySelectorAll('.ropt').forEach(b => {
        b.classList.toggle('sel', parseInt(b.dataset.val) === v);
    });
    $rbadge.textContent = v === 0 ? '∞' : v;
    savePref();
}

// ═══════════════════════════════════════════════════════
//  오디오 엔진
// ═══════════════════════════════════════════════════════
function stopAudio() {
    if (audio) {
        audio.onended = null;
        audio.ontimeupdate = null;
        audio.onloadedmetadata = null;
        audio.onerror = null;
        audio.pause();
        audio.src = '';
    }
    audio = null;
    isPlaying = false;
    $playBtn.innerHTML = ICON_PLAY;
    setMediaState('none');
    $progFill.style.width = '0%';
    $curTime.textContent  = '0:00';
    $totTime.textContent  = '0:00';
    clearCards();
}

function loadPlay(fileSrc, onEnd, onErr) {
    if (audio) { audio.onended=null; audio.onerror=null; audio.pause(); audio.src=''; }
    audio = new Audio();
    audio.playbackRate = SPEEDS[speedIdx];

    audio.onloadedmetadata = () => { $totTime.textContent = fmt(audio.duration); };
    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100 || 0;
        $progFill.style.width = pct + '%';
        $curTime.textContent  = fmt(audio.currentTime);
    };
    audio.onended = onEnd;
    audio.onerror = onErr;
    audio.src = fileSrc;
    return audio.play().catch(onErr);
}

// 제목 재생 (독립적, 반복 없음)
// 메인 재생: 큐 기반 반복
function startPlay() {
    stopAudio();
    queue      = buildQueue();
    qIdx       = 0;
    repeatNow  = 1;
    isPlaying  = true;
    $playBtn.innerHTML = ICON_PAUSE;
    playNext();
}

function playNext() {
    if (qIdx >= queue.length) {
        // 한 사이클 완료 → 반복 처리
        if (repeatTotal !== 0 && repeatNow >= repeatTotal) {
            // 완료
            isPlaying = false;
            $playBtn.innerHTML = ICON_PLAY;
            setStatus('', `✓ 반복 완료 (${repeatTotal}회)`);
            clearCards();
            return;
        }
        repeatNow++;
        qIdx = 0;
        playNext();
        return;
    }

    const track = queue[qIdx];      // 1=제목, 2=1절, 3=2절

    if (track === 1) {
        // 제목: 카드 하이라이트 없이 재생
        clearCards();
        setStatus('playing', `${WEEKS[week].label} 제목 재생 중`);
    } else {
        const vi = track - 2;       // 카드 인덱스 (0 또는 1)
        setCardPlaying(vi);
        updateStatus();
        const card = document.getElementById(`card-${vi}`);
        if (card) card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }

    setMediaMetadata(track);
    setMediaState('playing');

    loadPlay(
        src(week, track),
        () => { qIdx++; playNext(); },
        () => {
            isPlaying = false;
            $playBtn.innerHTML = ICON_PLAY;
            setMediaState('paused');
            setStatus('error', navigator.onLine
                ? `음성 파일을 재생할 수 없습니다: ${src(week, track)}`
                : '오프라인 상태입니다 — 아직 저장되지 않은 구절입니다');
        }
    );
}

function togglePlay() {
    if (isPlaying) {
        if (audio) audio.pause();
        isPlaying = false;
        $playBtn.innerHTML = ICON_PLAY;
        setMediaState('paused');
        setStatus('', '일시정지됨');
    } else if (audio && audio.src && !audio.ended) {
        audio.play().then(() => {
            isPlaying = true;
            $playBtn.innerHTML = ICON_PAUSE;
            setMediaState('playing');
            updateStatus();
        }).catch(() => startPlay());
    } else {
        startPlay();
    }
}

// ═══════════════════════════════════════════════════════
//  잠금화면 / 알림창 재생 정보 (MediaSession)
// ═══════════════════════════════════════════════════════
const hasMediaSession = 'mediaSession' in navigator;

function setMediaMetadata(track) {
    if (!hasMediaSession) return;
    const w = WEEKS[week];
    const heading = track === 1 ? w.theme[lang] : w.verses[track-2].ref[lang];
    navigator.mediaSession.metadata = new MediaMetadata({
        title:  heading,
        artist: `${w.label} · ${w.theme[lang]}`,
        album:  lang === 'ko' ? '사역반 성경암송' : 'Ministry Memory Verses',
        artwork: [
            { src: 'icon-192.png', sizes: '192x192', type: 'image/png' },
            { src: 'icon-512.png', sizes: '512x512', type: 'image/png' },
        ],
    });
}

function setMediaState(state) {
    if (hasMediaSession) navigator.mediaSession.playbackState = state;
}

function setupMediaSession() {
    if (!hasMediaSession) return;
    const on = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
    on('play',  () => { if (!isPlaying) togglePlay(); });
    on('pause', () => { if (isPlaying)  togglePlay(); });
    on('previoustrack', () => { if (week > 0) selectWeek(week - 1); });
    on('nexttrack',     () => { if (week < WEEKS.length - 1) selectWeek(week + 1); });
    on('stop', stopAudio);
}

// ═══════════════════════════════════════════════════════
//  상태 텍스트
// ═══════════════════════════════════════════════════════
function updateStatus() {
    const rep = repeatTotal === 0 ? `∞ 무한반복` : `${repeatNow}/${repeatTotal}회`;
    setStatus('playing', `${WEEKS[week].label} ${wLabel()} 재생 중 — ${rep}`);
}
function setStatus(cls, msg) {
    $status.className = `status${cls ? ' '+cls : ''}`;
    $status.innerHTML = cls === 'playing'
        ? `<span class="wave-icon"><span></span><span></span><span></span><span></span></span>${msg}`
        : msg;
}

// ═══════════════════════════════════════════════════════
//  오프라인 대비: 선택한 과의 음성을 미리 받아 둔다
//  (서비스워커가 가로채 저장하므로 여기서는 요청만 보낸다)
// ═══════════════════════════════════════════════════════
function prefetchWeek(w) {
    if (!navigator.serviceWorker?.controller) return;   // 아직 설치 전
    if (!navigator.onLine) return;
    if (navigator.connection?.saveData) return;         // 데이터 절약 모드면 생략
    for (const track of (WEEKS[w].verses.length >= 2 ? [1, 2, 3] : [1, 2])) {
        fetch(src(w, track), { credentials: 'omit' }).catch(() => {});
    }
}

// ═══════════════════════════════════════════════════════
//  과 선택
// ═══════════════════════════════════════════════════════
function selectWeek(w) {
    stopAudio();
    week = w;
    syncModeAvail();
    renderTabActive();
    renderContent();
    // 탭 스크롤
    const tab = $weekTabs.children[w];
    if (tab) tab.scrollIntoView({ inline:'center', behavior:'smooth' });
    setStatus('', `${WEEKS[week].label} · ${WEEKS[week].theme[lang]}`);
    prefetchWeek(week);
}

// ═══════════════════════════════════════════════════════
//  이벤트
// ═══════════════════════════════════════════════════════
function setupEvents() {
    // 과 탭
    $weekTabs.addEventListener('click', e => {
        if (e.target.classList.contains('wtab'))
            selectWeek(parseInt(e.target.dataset.w));
    });

    // 언어 선택
    $langSeg.addEventListener('click', e => {
        const b = e.target.closest('.seg-btn');
        if (b) setLang(b.dataset.lang);
    });

    // 음성 성별 선택
    $genderSeg.addEventListener('click', e => {
        const b = e.target.closest('.seg-btn');
        if (b) setGender(b.dataset.gender);
    });

    // 재생 / 일시정지
    $playBtn.addEventListener('click', togglePlay);

    // 이전 / 다음
    $prevBtn.addEventListener('click', () => {
        if (week > 0) selectWeek(week - 1);
    });
    $nextBtn.addEventListener('click', () => {
        if (week < WEEKS.length - 1) selectWeek(week + 1);
    });

    // 재생 속도
    $speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        if (audio) audio.playbackRate = SPEEDS[speedIdx];
        $speedBtn.textContent = SPEEDS[speedIdx] === 1 ? '1x' : SPEEDS[speedIdx] + 'x';
    });

    // 설정 시트 열기 (하단 설정 바 · 반복 버튼 모두 같은 시트)
    $settingsBtn.addEventListener('click', openSettings);
    $repeatBtn.addEventListener('click', openSettings);
    $overlay.addEventListener('click', e => { if (e.target === $overlay) closeSettings(); });
    $sheetClose.addEventListener('click', closeSettings);

    // 반복 횟수
    document.querySelectorAll('.ropt').forEach(btn => {
        btn.addEventListener('click', () => setRepeat(parseInt(btn.dataset.val)));
    });

    // 재생 구간
    $modeSeg.addEventListener('click', e => {
        const b = e.target.closest('.seg-btn');
        if (!b || b.dataset.mode === mode) return;
        setMode(b.dataset.mode);
        if (isPlaying) startPlay();   // 재생 중이면 즉시 새 구간으로 재시작
    });

    // 프로그레스 클릭
    $progTrack.addEventListener('click', e => {
        if (!audio || !audio.duration) return;
        const r = $progTrack.getBoundingClientRect();
        audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
}

// ═══════════════════════════════════════════════════════
//  초기화
// ═══════════════════════════════════════════════════════
// 홈 화면 설치·오프라인 재생을 담당하는 서비스워커
function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

function init() {
    registerSW();
    setupMediaSession();
    loadPref();
    document.documentElement.lang = lang;
    $langSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    $genderSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.gender === gender));
    setMode(mode);
    setRepeat(repeatTotal);
    updateSummary();
    renderTabs();
    selectWeek(0);
    setupEvents();
}
init();
</script>
</body>
</html>
